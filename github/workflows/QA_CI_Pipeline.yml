name: QA CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  qa-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalación de dependencias
        run: |
          npm ci
          npx playwright install

      - name: Ejecutar pruebas automatizadas
        run: |
          npx playwright test --reporter=html --output=playwright-report

      - name: Verificar secretos expuestos
        uses: trufflesecurity/trufflehog@v3
        with:
          scan: .

      - name: Evaluar performance
        run: |
          npx playwright test --project=performance
          node scripts/check-performance.js

      - name: Validar umbrales de calidad
        run: |
          node scripts/validate-quality-gates.js

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-qa
          path: |
            playwright-report/
            logs/
